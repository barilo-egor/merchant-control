spring:
  application:
    name: merchant-control-test
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:merchant-control-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
